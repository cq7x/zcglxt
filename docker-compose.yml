version: '3.8'

services:
  # 整合服务：前端 + 后端
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zcglxt-app
    restart: unless-stopped
    ports:
      - "13081:80"
    volumes:
      - app-data:/app/server/data
      - app-uploads:/app/server/uploads
    environment:
      - NODE_ENV=production

volumes:
  app-data:
  app-uploads:
